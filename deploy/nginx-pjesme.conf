# Nginx reverse proxy za Pjesme Print
# Kopiraj u /etc/nginx/sites-available/pjesme i zamijeni server_name svojom domenom.
# Aktivacija:
#   sudo ln -s /etc/nginx/sites-available/pjesme /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name pjesme.mojadomena.com;

    # Mora biti veće od MAX_UPLOAD_MB u aplikaciji
    client_max_body_size 60M;

    # Docker varijanta sluša na 8010 (vidi docker-compose.yml);
    # systemd varijanta (gunicorn) na 8000 — prilagodi proxy_pass po potrebi.
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Konverzija velikih PDF-ova može potrajati
        proxy_read_timeout 300s;
    }
}

# ── Varijanta za portal s više aplikacija ─────────────────────────────────────
# Ako na portu 80 imaš zajednički portal, pjesme možeš servirati na putanji
# /pjesme/ — dodaj ovaj location u postojeći server blok (aplikacija je
# spremna za rad iza prefiksa):
#
#     location /pjesme/ {
#         proxy_pass http://127.0.0.1:8010/;   # završna kosa crta skida /pjesme/
#         proxy_set_header Host $host;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_read_timeout 300s;
#         client_max_body_size 60M;
#     }
#     location = /pjesme { return 301 /pjesme/; }
