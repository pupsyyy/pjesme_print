services:
  pjesme:
    build:
      context: .
      args:
        # 1 = i prepoznavanje nota iz PDF-a (Audiveris -> MusicXML); slika je
        # ~250 MB veća, a prepoznavanje treba ~1 GB RAM-a. Upiši WITH_OMR=1 u .env
        # i ponovo izgradi: docker compose up -d --build
        WITH_OMR: ${WITH_OMR:-0}
    container_name: pjesme_print
    restart: unless-stopped
    ports:
      # Vezano samo na localhost: izvana je aplikacija dostupna isključivo
      # kroz reverse proxy (Caddy/nginx) na putanji domene, npr.
      # https://josip.cloud/print_pjesme — vidi deploy/Caddyfile-primjer.
      - "127.0.0.1:8010:8000"
      # Za izravni pristup izvana (http://IP:8010/, bez proxyja) zamijeni s:
      # - "8010:8000"
    environment:
      - MAX_UPLOAD_MB=50
      - DB_PATH=/app/data/pjesme.db
      # Lozinka za uvoz/brisanje u bazi pjesama i token za API drugih aplikacija.
      # Upiši ih u datoteku .env pored ovog docker-compose.yml (ne ide u git):
      #   DB_PASSWORD=nesto-tajno
      #   API_TOKEN=dugi-nasumicni-token
      - DB_PASSWORD=${DB_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
    volumes:
      # Baza pjesama (SQLite) ostaje na serveru i kad se kontejner obnovi:
      # /opt/pjesme_print/data/pjesme.db
      - ./data:/app/data
    # Rotacija logova: da datoteka logova ne raste beskonačno (3 x 10 MB)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
