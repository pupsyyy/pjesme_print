services:
  pjesme:
    build: .
    container_name: pjesme_print
    restart: unless-stopped
    ports:
      # Aplikacija dostupna na http://IP-servera:8010/
      # (port 80 ostaje slobodan za portal / druge aplikacije na serveru)
      - "8010:8000"
      # Kad ispred staneš nginx portal ili HTTPS (vidi DEPLOY.md), zamijeni s:
      # - "127.0.0.1:8010:8000"
    environment:
      - MAX_UPLOAD_MB=50
